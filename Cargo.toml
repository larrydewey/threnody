[workspace]
resolver = "3"
members = ["crates/threnody-core", "crates/threnody-net", "crates/threnody-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/larrydewey/threnody"

[workspace.dependencies]
threnody-core = { path = "crates/threnody-core" }
threnody-net = { path = "crates/threnody-net" }
const-cbor = { version = "0.3", features = ["std"] }
ml-kem = { version = "0.2.3", features = ["zeroize", "deterministic"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
sha3 = "0.10"
blake3 = "1.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "fs", "macros", "sync", "time", "signal"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
qrcode = { version = "0.14", default-features = false }
tempfile = "3"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
rpassword = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Crypto dependencies are unusably slow unoptimised; keep our crates debuggable.
[profile.dev.package."*"]
opt-level = 3
