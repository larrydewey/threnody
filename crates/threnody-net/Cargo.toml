[package]
name = "threnody-net"
description = "Transports and session driver for Threnody."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
boringtun = ["dep:boringtun", "dep:threnody-tun"]

[dependencies]
threnody-core.workspace = true
tokio.workspace = true
thiserror.workspace = true
zeroize.workspace = true
socket2.workspace = true
const-cbor.workspace = true
anyhow.workspace = true
boringtun = { workspace = true, optional = true }
threnody-tun = { workspace = true, optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "log"] }
rcgen = "0.14"
mainline = "8"
futures-lite = "2"
port-control-client = "0.2"
blake3.workspace = true
chacha20poly1305.workspace = true
rand_core.workspace = true
# Wake-ups to UnifiedPush endpoints (Appendix R): both already in the tree
# (reqwest via threnody-core's link previews, ring via rustls).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"

[dev-dependencies]
mainline = "8"
tempfile.workspace = true

[lints]
workspace = true
