[package]
name = "threnody-ffi"
description = "UniFFI bindings (Kotlin, Swift, Python) for embedding a Threnody node in apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "threnody_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
boringtun = ["threnody-net/boringtun"]

[dependencies]
threnody-core.workspace = true
threnody-net.workspace = true
tokio.workspace = true
thiserror.workspace = true
qrcode.workspace = true
threnody-groups = { workspace = true, features = ["node"] }
uniffi = "0.32"
rqrr = { version = "0.11.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
