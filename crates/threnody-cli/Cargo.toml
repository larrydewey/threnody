[package]
name = "threnody-cli"
description = "Command-line Threnody client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "threnody"
path = "src/main.rs"

[dependencies]
threnody-core.workspace = true
threnody-net.workspace = true
threnody-groups = { workspace = true, features = ["node"] }
tokio = { workspace = true, features = ["process"] }
clap.workspace = true
anyhow.workspace = true
keyring = "4.2"
qrcode.workspace = true
rpassword.workspace = true
zeroize.workspace = true
jiff = "0.2.38"
threnody-radio.workspace = true

[features]
default = ["ble"]
# Bluetooth LE transport via BlueZ (Linux only).
ble = ["threnody-radio/ble"]
# Userspace WireGuard via boringtun (Android, iOS, unprivileged).
boringtun = ["threnody-net/boringtun"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
