# cargo-audit settings (the CI audit job and scripts/pre-push).

[advisories]
ignore = [
    # crypto-bigint 0.5.5: timing variability in operations meant to be
    # constant time. It comes in through zkryptium -> bls12_381_plus 0.8 ->
    # elliptic-curve 0.13, and no release of either moves off it yet
    # (zkryptium 0.8 still uses bls12_381_plus 0.8). bls12_381_plus does its
    # field and scalar arithmetic itself and uses crypto-bigint only for the
    # group order constant and word/byte conversions; zkryptium uses
    # elliptic-curve only for hash-to-curve message expansion and group
    # traits. No secret arithmetic runs through crypto-bigint. Drop this
    # once zkryptium moves to a fixed crypto-bigint (>= 0.7.6).
    "RUSTSEC-2026-0387",
    # libsqlite3-sys 0.35.0 (bundled SQLite CVE-2026-119375): it is in
    # Cargo.lock only because openmls 0.9 has an optional dependency on
    # openmls_sqlite_storage -> rusqlite 0.37, which pins it below the fix
    # (0.39). Nothing here enables that storage; `cargo tree --workspace
    # --all-features --target all -e normal,build,dev -i libsqlite3-sys`
    # finds nothing, so SQLite is never compiled into any build. Drop this
    # once openmls moves to rusqlite >= 0.39.
    "RUSTSEC-2026-0459",
]
