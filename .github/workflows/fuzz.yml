# Fuzzes the parsers that take untrusted bytes (fuzz/README.md), weekly and
# on demand. Crashing inputs are kept as an artifact.
name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [envelope, handshake_respond, handshake_finish, app_message, credential, directory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Run
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="$SECONDS_PER_TARGET"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 14
