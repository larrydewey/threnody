# Publishes a GitHub Release for a version tag (v1.2.3, or v1.2.3-rc.1 for
# a pre-release): CLI binaries, the Android app, FFI libraries with their
# bindings, and SHA-256 checksums of everything.
#
# Android signing uses these repository secrets when they are set (the
# release APK is published unsigned without them):
#   ANDROID_KEYSTORE_BASE64   the keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag matches the workspace version
        run: |
          version="${TAG#v}"
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "${version%%-*}" != "$crate" ]]; then
            echo "::error::tag $TAG does not match the workspace version $crate"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"${crate}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Android version codes must grow with each release.
          echo "code=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && pre=true || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI ${{ matrix.target }}
    needs: [ci, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          # Cross-compiled; without Bluetooth LE (BlueZ's libdbus isn't
          # available for the target here).
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, flags: --no-default-features }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --locked -p threnody-cli --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Package
        shell: bash
        run: |
          name="threnody-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=threnody; [[ "${{ runner.os }}" == Windows ]] && bin=threnody.exe
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          cd dist
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  ffi:
    name: FFI library ${{ matrix.target }}
    needs: [ci, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, lib: libthrenody_ffi.so }
          - { target: aarch64-apple-darwin, os: macos-latest, lib: libthrenody_ffi.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the library and generate bindings
        run: |
          cargo build --release --locked -p threnody-ffi
          name="threnody-ffi-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for lang in python kotlin swift; do
            cargo run --locked -q -p threnody-ffi --features bindgen --bin uniffi-bindgen -- generate \
              --library "target/release/${{ matrix.lib }}" --language "$lang" --no-format \
              --out-dir "dist/$name/$lang"
          done
          cp "target/release/${{ matrix.lib }}" LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android app
    needs: [ci, version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            base64 -d <<<"$KEYSTORE" > "$RUNNER_TEMP/release.keystore"
            echo "THRENODY_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: publishing an unsigned APK"
          fi
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          THRENODY_VERSION: ${{ needs.version.outputs.version }}
          THRENODY_VERSION_CODE: ${{ needs.version.outputs.code }}
          THRENODY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          THRENODY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          THRENODY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apps/android/build.sh --emulator --release
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          apk=$(find apps/android/app/build/outputs/apk/release -name 'app-release*.apk' | head -1)
          suffix=""; [[ "$apk" == *unsigned* ]] && suffix="-unsigned"
          cp "$apk" "dist/threnody-$v-android$suffix.apk"
          # The native libraries and Kotlin bindings, for embedding in other apps.
          (cd apps/android/app/src/main && zip -qr "$GITHUB_WORKSPACE/dist/threnody-ffi-$v-android.zip" \
            jniLibs java/uniffi)
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, cli, ffi, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          [[ "${{ needs.version.outputs.prerelease }}" == true ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes \
              --title "Threnody ${{ needs.version.outputs.version }}" "${flags[@]}"
          fi
