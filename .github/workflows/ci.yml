# Checks every push and pull request; the release workflow runs it first.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; master and tags run through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Linux build dependencies (BlueZ, GTK 4, libadwaita)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpcsclite-dev
      # libwebrtc's hermetic libc++ needs clang 21+; ubuntu-24.04 ships 18.
      - name: clang 21 (threnody-media links libwebrtc)
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      # --all-features never compiles the code builds without calls run
      # (iOS, the F-Droid build, desktop builds from source only).
      - name: Clippy without calls
        run: cargo clippy -p threnody-ffi -p threnody-desktop --no-default-features --all-targets --locked

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Linux build dependencies (BlueZ, GTK 4, libadwaita)
        # The base and good GStreamer plugins: the QR scanner test runs a pipeline.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpcsclite-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      # libwebrtc's hermetic libc++ needs clang 21+; ubuntu-24.04 ships 18.
      - name: clang 21 (threnody-media links libwebrtc)
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Tests (threnody-ffi without calls)
        run: cargo test -p threnody-ffi --locked --no-fail-fast
      - name: CLI without Bluetooth (the ble gate still builds)
        run: cargo build -p threnody-cli --no-default-features --locked

  bindings:
    name: FFI bindings (Python test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: crates/threnody-ffi/bindings.sh

  android:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build (phone and emulator ABIs)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          apps/android/build.sh --emulator
          # Only the ABIs libthrenody_ffi.so was built for, not every one JNA ships.
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          libs=$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          [[ "$libs" == "arm64-v8a x86_64 " ]] || { echo "::error::unexpected ABIs: $libs"; exit 1; }
      # Before the F-Droid build below, which overwrites the debug APK.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threnody-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: F-Droid build (no calls)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          # Nothing in the no-calls Android tree may pull in WebRTC. (Checked
          # on files: under pipefail, `grep -q` on a pipe can pass a match.)
          out="$RUNNER_TEMP/nocalls"
          mkdir -p "$out"
          cargo tree --locked -p threnody-ffi --features boringtun --target aarch64-linux-android \
              -e normal,build > "$out/tree.txt"
          if grep -i 'webrtc\|livekit' "$out/tree.txt"; then
              echo "::error::WebRTC in the no-calls dependency tree"; exit 1
          fi
          apps/android/build.sh --no-calls
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          libs=$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          [[ "$libs" == "arm64-v8a " ]] || { echo "::error::unexpected ABIs: $libs"; exit 1; }
          unzip -q -o "$apk" 'lib/*' 'classes*.dex' -d "$out/apk"
          # WebRTC links statically into libthrenody_ffi.so (no separate .so to
          # look for), so check its JNI symbols and the jar's classes instead.
          test -s "$out/apk/lib/arm64-v8a/libthrenody_ffi.so"
          if grep -aq 'Java_livekit_org_webrtc_' "$out/apk/lib/arm64-v8a/libthrenody_ffi.so"; then
              echo "::error::WebRTC in the no-calls native library"; exit 1
          fi
          if grep -aq 'Llivekit/org/webrtc/PeerConnectionFactory;' "$out"/apk/classes*.dex; then
              echo "::error::libwebrtc.jar classes in the no-calls APK"; exit 1
          fi

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install xcodegen
      - name: Build the XCFramework and Swift bindings
        run: apps/ios/build-xcframework.sh
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: apps/ios
        run: |
          xcodebuild build -project Threnody.xcodeproj -scheme Threnody -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

  portability:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p threnody-cli -p threnody-ffi --locked
      - run: cargo test -p threnody-core -p threnody-groups --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - run: cargo audit
