# XcodeGen spec: `xcodegen generate` writes Threnody.xcodeproj.
# Run build-xcframework.sh first; it makes Generated/ThrenodyFFI.xcframework
# and Threnody/Generated/threnody_ffi.swift.
name: Threnody
options:
  bundleIdPrefix: org.threnody
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.16.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Threnody:
    type: application
    platform: iOS
    scheme:
      testTargets: [ThrenodyTests]
    sources:
      - path: Threnody
    dependencies:
      - framework: Generated/ThrenodyFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: libresolv.tbd
      # Tapping an Android phone that shows its invite (Appendix T).
      - sdk: CoreNFC.framework
      # App lock: Face ID, Touch ID and the passcode.
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.threnody.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your team here or in Xcode (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # NFC tag reading (Appendix T). Signed device builds need a paid team
    # for this capability; CI builds for the simulator, unsigned.
    entitlements:
      path: Threnody/Threnody.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
    info:
      path: Threnody/Info.plist
      properties:
        CFBundleDisplayName: Threnody
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Threnody uses the camera to scan invite QR codes.
        NSLocalNetworkUsageDescription: Threnody connects directly to your contacts' devices on the local network.
        NFCReaderUsageDescription: Threnody reads a nearby phone's invite when you tap phones to add a contact.
        NSFaceIDUsageDescription: Threnody uses Face ID to unlock the app.
        # QuickLook's share sheet offers "Save Image". No read access is
        # asked for: the photo picker runs outside the app.
        NSPhotoLibraryAddUsageDescription: Threnody saves the photos you choose to your library.
        # The tap protocol's AID: must match threnody_core::tap::AID.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - F0746872656E6F6479
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.threnody.app.refresh
  # Unit tests, hosted by the app (which then opens no node of its own).
  ThrenodyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThrenodyTests
    dependencies:
      - target: Threnody
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.threnody.app.tests
        # The app's module refers to the bindings' C module, which the tests
        # must find too (only the app links the XCFramework).
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/headers
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated/headers
