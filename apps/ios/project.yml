# XcodeGen spec: `xcodegen generate` writes Threnody.xcodeproj.
# Run build-xcframework.sh first; it makes Generated/ThrenodyFFI.xcframework
# and Threnody/Generated/threnody_ffi.swift.
name: Threnody
options:
  bundleIdPrefix: org.threnody
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.16.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Threnody:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Threnody
    dependencies:
      - framework: Generated/ThrenodyFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.threnody.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your team here or in Xcode (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Threnody/Info.plist
      properties:
        CFBundleDisplayName: Threnody
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Threnody uses the camera to scan invite QR codes.
        NSLocalNetworkUsageDescription: Threnody connects directly to your contacts' devices on the local network.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.threnody.app.refresh
