# fdroiddata recipe for Threnody: copy to metadata/org.threnody.app.yml.
#
# F-Droid builds without calls: they need LiveKit's prebuilt libwebrtc,
# which F-Droid can't use. -Pthrenody.calls=false and build.sh --no-calls
# leave WebRTC out entirely (nothing is downloaded but crates and Gradle
# dependencies), the call buttons disappear, and the node tells contacts it
# doesn't take calls. A group call doesn't ring this build, and it can't
# start or join one.
#
# The license is "Apache-2.0 OR MIT" (dual); fdroiddata takes one SPDX id,
# so this uses Apache-2.0, as other dual-licensed Rust apps do.
#
# Each release's "prepare" commit sets the versions below to that release.
# 0.19.0 was the first release built this way.

AntiFeatures:
  NonFreeNet:
    en-US: >-
      Optional GIF search uses the GIPHY API (a proprietary service). It is
      off until the user agrees to it, and F-Droid builds carry no API key,
      so the user must also supply their own.
Categories:
  - Internet
  - Security
License: Apache-2.0
AuthorName: Larry Dewey
WebSite: https://github.com/larrydewey/threnody
SourceCode: https://github.com/larrydewey/threnody
IssueTracker: https://github.com/larrydewey/threnody/issues
Changelog: https://github.com/larrydewey/threnody/releases

AutoName: Threnody

RepoType: git
Repo: https://github.com/larrydewey/threnody.git

Builds:
  - versionName: 1.0.0
    versionCode: 1000000
    commit: v1.0.0
    subdir: apps/android/app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential pkg-config
    srclibs:
      - rustup@1.28.2
    # The wrapper jar is a binary; F-Droid uses its own Gradle.
    rm:
      - apps/android/gradle/wrapper/gradle-wrapper.jar
    prebuild:
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.99.0 --target aarch64-linux-android
      - source $HOME/.cargo/env
      - cargo fetch --locked --manifest-path ../../../Cargo.toml
    # apps/android/build.sh minus Gradle: cross-compiles libthrenody_ffi.so
    # (arm64-v8a, without calls) into jniLibs and generates the UniFFI
    # Kotlin bindings.
    build:
      - source $HOME/.cargo/env
      - ANDROID_NDK_HOME=$$NDK$$ ../build.sh --native-only --no-calls
    ndk: 28.2.13676358
    gradle:
      - yes
    gradleprops:
      - threnody.calls=false

MaintainerNotes: |-
  versionCode = major * 1000000 + minor * 1000 + patch; app/build.gradle.kts
  carries it as a literal (checked against Cargo.toml at build time).
  The Rust toolchain pin follows rust-version in the workspace Cargo.toml;
  bump --default-toolchain when that changes.
  Calls are off in this build (see the comment at the top).

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1000000
